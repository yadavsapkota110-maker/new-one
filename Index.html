<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ASMINA ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:white;
    background:
    radial-gradient(circle,#3b1455,#100018 60%,#020003);
}

/* INTRO */

#intro{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:10;
}

#intro h2{
    margin-bottom:30px;
}

.gift{
    font-size:110px;
    cursor:pointer;
    animation:gift 1.3s infinite alternate;
}

#intro p{
    margin-top:20px;
}

/* BIRTHDAY */

#birthday{
    display:none;
    position:absolute;
    inset:0;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:5;
}

.content{
    width:94%;
    max-width:700px;
    animation:show 1.5s ease;
}

.heart{
    font-size:55px;
    animation:heartbeat 1s infinite;
}

h1{
    font-size:clamp(45px,11vw,85px);
    background:linear-gradient(
        90deg,
        #ff3d9d,
        white,
        #ff70ba
    );
    -webkit-background-clip:text;
    color:transparent;
}

.name{
    font-size:clamp(32px,9vw,65px);
    color:#ff70b8;
    text-shadow:0 0 30px #ff1590;
    margin:10px;
}

.message{
    line-height:1.7;
    color:#f8d9e9;
}

/* PHOTO COLLECTION */

#gallery{
    display:none;
    position:absolute;
    inset:0;
    justify-content:center;
    align-items:center;
    z-index:8;
}

.photo-box{
    width:85%;
    max-width:430px;
    text-align:center;
    animation:photoShow 0.3s infinity;
}

.photo-box img{
    width:100%;
    height:480px;
    object-fit:cover;
    border-radius:25px;
    border:3px solid rgba(255,255,255,.7);
    box-shadow:
    0 0 20px #ff3d9d,
    0 0 60px rgba(255,0,150,.5);
}

.caption{
    margin-top:18px;
    font-size:20px;
    color:#ffd6ea;
}

.counter{
    margin-top:8px;
    opacity:.7;
}

/* BUTTON */

button{
    margin-top:22px;
    padding:14px 28px;
    border:0;
    border-radius:30px;
    background:#ff2995;
    color:white;
    font-size:17px;
    box-shadow:0 0 25px #ff2995;
}

/* HEARTS */

.floating{
    position:absolute;
    bottom:-50px;
    font-size:25px;
    animation:floatUp linear forwards;
    z-index:2;
}

/* CONFETTI */

.confetti{
    position:absolute;
    top:-30px;
    font-size:25px;
    animation:fall linear forwards;
    z-index:20;
}

/* ANIMATIONS */

@keyframes gift{
    from{
        transform:rotate(-5deg);
    }

    to{
        transform:rotate(5deg) translateY(-15px);
    }
}

@keyframes show{
    from{
        opacity:0;
        transform:scale(.3);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes heartbeat{
    50%{
        transform:scale(1.3);
    }
}

@keyframes photoShow{

    from{
        opacity:0;
        transform:scale(.7) rotate(-5deg);
    }

    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

@keyframes floatUp{

    from{
        transform:translateY(0) rotate(0);
        opacity:1;
    }

    to{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

@keyframes fall{

    from{
        transform:translateY(0) rotate(0);
    }

    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

</style>
</head>


<body>


<!-- STEP 1 -->

<div id="intro">

    <h2>
        ✨ A Special Surprise For You ✨
    </h2>

    <div class="gift" onclick="openGift()">
        🎁
    </div>

    <p>
        Tap the gift ❤️
    </p>

</div>



<!-- STEP 2 -->

<div id="birthday">

    <div class="content">

        <div class="heart">
            ❤️
        </div>

        <h1>
            Happy Birthday
        </h1>

        <div class="name">
            Aasmani thapa
        </div>

        <div class="message">

            May your smile always shine brighter
            than the stars. ✨

            <br>

            May all your dreams come true. 🌙

            <br>

            Wishing you happiness,
            love and beautiful memories. ❤️

        </div>

        <div style="font-size:80px;margin:20px;">
            🎂
        </div>

        <button onclick="showGallery()">
            📸 Our Memories
        </button>

    </div>

</div>



<!-- STEP 3 PHOTO COLLECTION -->

<div id="gallery">

    <div class="photo-box">

        <img id="photo"
        src="photo1.jpg">

        <div class="caption"
        id="caption">

            Beautiful Memories ❤️

        </div>

        <div class="counter"
        id="counter">

            1 / 6

        </div>

    </div>

</div>



<script>

/* PHOTOS */

let photos = [

    "Messenger_creation_872DEE2B-E017-4124-B97F-E54AF2301A16.jpeg",
    "Messenger_creation_2E57573B-BD12-4638-BFCB-8B41BFF45D60.jpeg",
    "Messenger_creation_A2541A5C-5BED-443C-A203-B5358FD07D00.jpeg",
    "IMG-20250306-WA0007.jpg",
    "IMG-20250306-WA0002.jpg",
    "IMG-20250205-WA0006.jpg"
];


/* CAPTIONS */

let captions = [

    "A beautiful smile ❤️",

    "One beautiful memory ✨",

    "Keep smiling forever 💖",

    "A moment to remember 🌙",

    "Beautiful as always 💕",

    "Happy Birthday Aarati ❤️"

];


let currentPhoto = 0;



/* OPEN GIFT */

function openGift(){

    document.getElementById("intro")
    .style.display="none";

    document.getElementById("birthday")
    .style.display="flex";

    createHearts();

    setTimeout(function(){

        celebrate();

    },1500);

}



/* SHOW GALLERY */

function showGallery(){

    document.getElementById("birthday")
    .style.display="none";

    document.getElementById("gallery")
    .style.display="flex";

    currentPhoto=0;

    showPhoto();

    startSlideshow();

}



/* SHOW PHOTO */

function showPhoto(){

    let photo =
    document.getElementById("photo");

    let caption =
    document.getElementById("caption");

    let counter =
    document.getElementById("counter");


    photo.src =
    photos[currentPhoto];


    caption.innerHTML =
    captions[currentPhoto];


    counter.innerHTML =
    (currentPhoto+1)+" / "+photos.length;


    /* Restart animation */

    photo.style.animation="none";

    photo.offsetHeight;

    photo.style.animation=
    "photoShow 1.2s ease";

}



/* AUTOMATIC SLIDESHOW */

function startSlideshow(){

    setInterval(function(){

        currentPhoto++;

        if(currentPhoto >= photos.length){

            currentPhoto=0;

        }

        showPhoto();

    },2000);

}



/* FLOATING HEARTS */

function createHearts(){

    setInterval(function(){

        let heart =
        document.createElement("div");

        heart.className="floating";

        let list=[
            "❤️",
            "💖",
            "💕",
            "💗",
            "💘",
            "✨"
        ];

        heart.innerHTML =
        list[
            Math.floor(
                Math.random()*list.length
            )
        ];

        heart.style.left =
        Math.random()*100+"vw";

        heart.style.animationDuration =
        (4+Math.random()*4)+"s";

        document.body.appendChild(heart);


        setTimeout(function(){

            heart.remove();

        },8000);

    },400);

}



/* CONFETTI */

function celebrate(){

    for(let i=0;i<100;i++){

        let piece =
        document.createElement("div");

        piece.className="confetti";

        let items=[
            "🎉",
            "🎊",
            "✨",
            "💖",
            "⭐"
        ];

        piece.innerHTML =
        items[
            Math.floor(
                Math.random()*items.length
            )
        ];

        piece.style.left =
        Math.random()*100+"vw";

        piece.style.animationDuration =
        (2+Math.random()*4)+"s";

        document.body.appendChild(piece);


        setTimeout(function(){

            piece.remove();

        },6000);

    }

}

</script>

</body>
</html>
